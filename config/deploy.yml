service: tramline
image: tramlinehq/tramline

servers:
  web:
    hosts:
      - <%= ENV["HETZNER_IP"] %>
    cmd: bundle exec puma -C config/puma.rb
    options:
      memory: 4g
      cpus: 2
    # Stable Dozzle identity: Kamal names app containers with the git SHA, so a
    # new one appears each deploy. A fixed name + group keeps the log view from
    # scattering across SHA-suffixed entries (see also DOZZLE_FILTER below).
    labels:
      dev.dozzle.name: tramline-web
      dev.dozzle.group: tramline
  worker:
    hosts:
      - <%= ENV["HETZNER_IP"] %>
    cmd: bundle exec sidekiq
    options:
      memory: 4g
      cpus: 2
    proxy: false
    labels:
      dev.dozzle.name: tramline-worker
      dev.dozzle.group: tramline
    env:
      clear:
        # Sidekiq runs SIDEKIQ_CONCURRENCY threads; the AR pool (database.yml
        # pool = RAILS_MAX_THREADS) must cover them plus Sidekiq's own internal
        # threads, or job threads block on ConnectionTimeoutError. Overrides the
        # global 5 for this role only. Keep >= SIDEKIQ_CONCURRENCY + 2.
        RAILS_MAX_THREADS: 12

proxy:
  app_port: 3000
  ssl: true
  host: tramline.dev
  healthcheck:
    path: /up
    interval: 3
    timeout: 5
  buffering:
    requests: true
    responses: true
    max_request_body: 100_000_000

builder:
  arch: amd64
  args:
    # assets:precompile decrypts config/credentials/<RAILS_PIPELINE_ENV>.yml.enc
    # with RAILS_MASTER_KEY; keep this in sync with the key each destination
    # provides (staging overlay sets it to staging).
    RAILS_PIPELINE_ENV: production
  secrets:
    - RAILS_MASTER_KEY
<% if ENV["GITHUB_ACTIONS"] %>
  # gha cache only works inside GitHub Actions (needs ACTIONS_CACHE_URL /
  # ACTIONS_RUNTIME_TOKEN). Omitted for local builds so they don't fail.
  cache:
    type: gha
    options: mode=max
<% end %>

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy

deploy_timeout: 600
drain_timeout: 30

env:
  clear:
    RAILS_ENV: production
    RAILS_PIPELINE_ENV: production
    RAILS_LOG_TO_STDOUT: true
    RAILS_SERVE_STATIC_FILES: true
    # Puma sizing for the single box: 3 workers fits the web container's 2-CPU
    # share; 5 threads is the MRI sweet spot and also sets the web AR pool.
    # The worker role overrides RAILS_MAX_THREADS above.
    WEB_CONCURRENCY: 3
    RAILS_MAX_THREADS: 5
    SIDEKIQ_CONCURRENCY: 10
    SIDEKIQ_TIMEOUT: 25
    SESSION_TIMEOUT_IN_MINUTES: 60
    CSP_REPORT_ONLY: false
    GRACEFUL_ERROR_PAGES: true
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - REDIS_URL
    - DEFAULT_REDIS_URL
    - SESSION_REDIS_URL
    - SIDEKIQ_REDIS_URL
    - HOST_NAME
    - DESCOPE_PROJECT_ID
    - DESCOPE_MANAGEMENT_KEY
    - APPLELINK_URL
    - SENTRY_DSN
    - FRONTEND_SENTRY_DSN
    - SENTRY_SECURITY_HEADER_ENDPOINT
    - ARTIFACT_BUILDS_BUCKET_NAME
    - ARTIFACT_BUILDS_BUCKET_NAME_INDIA
    - ASSETS_BUCKET_NAME
    - APP_REDIRECT_MAPPING_JSON
    - X_MONITOR_ALLOWED
    - DISALLOWED_SIGN_UP_DOMAINS
    - CSP_CONNECT_SRC_URIS
    - CSP_SCRIPT_SRC_URIS
    - BILLING_URL
    - DEMO_ORG_SLUG
    - DEMO_USER_SLUG
    - POSTHOG_API_KEY
    - POSTHOG_HOST

accessories:
  db:
    image: postgres:14-trixie
    host: <%= ENV["HETZNER_IP"] %>
    env:
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - POSTGRES_DB
    directories:
      - tramline-db-data:/var/lib/postgresql/data
    options:
      memory: 2g
      cpus: 2
      restart: always
      shm-size: 256m

  redis-cache:
    image: redis:7-alpine
    host: <%= ENV["HETZNER_IP"] %>
    # Disposable cache: `--save ""` disables RDB snapshots (no fork, no disk),
    # so allkeys-lru can evict freely and 200/256 stays safe.
    cmd: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    directories:
      - tramline-redis-cache-data:/data
    options:
      memory: 256m
      cpus: 0.5
      restart: always

  redis-sidekiq:
    image: redis:7-alpine
    host: <%= ENV["HETZNER_IP"] %>
    # Job store: noeviction (fail enqueues rather than drop jobs) + AOF for
    # durability. Sized larger than the cache — 384/512 (~75%) leaves CoW
    # headroom for AOF rewrite and real backlog room before enqueues error.
    cmd: redis-server --maxmemory 384mb --maxmemory-policy noeviction --appendonly yes
    directories:
      - tramline-redis-sidekiq-data:/data
    options:
      memory: 512m
      cpus: 0.5
      restart: always

  applelink:
    image: ghcr.io/tramlinehq/applelink:latest
    host: <%= ENV["HETZNER_IP"] %>
    env:
      clear:
        # applelink only enables Sentry when the env resolves to production
        # (config.enabled_environments = %w[production]).
        RACK_ENV: production
        # applelink reports to its OWN Sentry project — a different DSN than
        # tramline's, so it can't share the app's SENTRY_DSN secret. Each
        # destination overlay sets SENTRY_DSN here as a literal (submit-only
        # DSN); kamal does not expose secrets-file vars to deploy.yml ERB.
      secret:
        - AUTH_ISSUER
        - AUTH_SECRET
        - AUTH_AUD
    options:
      restart: always
      memory: 2g
      cpus: 1

  # Read-only log viewer, behind Dozzle's built-in simple auth.
  # Credentials live in users.yml on the host (see docs/hetzner.md), never
  # in the repo. Served over TLS on its own subdomain via kamal-proxy.
  # Set SKIP_DOZZLE=1 to leave it out (e.g. first bring-up before users.yml
  # exists) — the accessory refuses to boot without it.
<% unless ENV["SKIP_DOZZLE"] %>
  dozzle:
    image: amir20/dozzle:latest
    host: <%= ENV["HETZNER_IP"] %>
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    directories:
      - tramline-dozzle-data:/data
    env:
      clear:
        DOZZLE_AUTH_PROVIDER: simple
        # Only list running containers, so prior-deploy (stopped) app containers
        # don't pile up in the sidebar. Trade-off: a crashed container is hidden
        # too — drop this (or toggle "show stopped" in the UI) when debugging a
        # failed boot.
        DOZZLE_FILTER: status=running
    options:
      restart: always
      memory: 128m
      cpus: 0.25
    proxy:
      ssl: true
      host: logs.tramline.dev
      app_port: 8080
      # Dozzle serves /healthcheck, not kamal-proxy's default /up — without
      # this the health check never passes and the boot hangs until timeout.
      healthcheck:
        path: /healthcheck
<% end %>

  # Host + container metrics WITH history (Dozzle's metrics are live-only).
  # /var/lib/netdata holds the time-series DB, persisted so history survives
  # restarts and redeploys.
  #
  # Deliberately NOT behind kamal-proxy: the agent dashboard has no built-in
  # auth, and claiming it to Netdata Cloud uses an OUTBOUND connection, so it
  # needs no inbound exposure. View it (SSO-gated) at app.netdata.cloud.
  # The published port is localhost-only, for `ssh -L` debugging.
  netdata:
    image: netdata/netdata:stable
    host: <%= ENV["HETZNER_IP"] %>
    port: "127.0.0.1:19999:19999"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Feeds Netdata's Logs tab (systemd-journal plugin) with host/system
      # logs — sshd, fail2ban, systemd units, kernel. Container logs stay in
      # Dozzle: kamal's containers use the json-file driver, not journald, so
      # they don't reach the journal.
      - /var/log:/host/var/log:ro
      - /etc/machine-id:/etc/machine-id:ro
    directories:
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - netdata-config:/etc/netdata
    files:
      # Enables the Postgres collector (needs credentials, so unlike Redis it
      # is never auto-discovered). ERB-rendered at deploy time from the secrets
      # file, so no password is committed.
      - config/netdata/go.d/postgres.conf.erb:/etc/netdata/go.d/postgres.conf
    env:
      clear:
        # gid of the host docker group, so netdata can read the socket and
        # label container metrics with real names. This differs per host
        # (install order decides it), so provisioning pins it to 999
        # (docs §5) and each destination can override via NETDATA_DOCKER_GID.
        # Check a box with: stat -c %g /var/run/docker.sock
        PGID: "<%= ENV.fetch('NETDATA_DOCKER_GID', '999') %>"
        NETDATA_CLAIM_URL: https://app.netdata.cloud
        # Netdata Cloud room to join on claim (an identifier, not a credential)
        NETDATA_CLAIM_ROOMS: 67bcfbf4-a218-4e32-af35-a5a43dbced6e
      secret:
        - NETDATA_CLAIM_TOKEN
        # consumed by the postgres.conf.erb above
        - DATABASE_URL
    options:
      restart: always
      memory: 768m
      cpus: 0.5
      cap-add: SYS_PTRACE
      security-opt: apparmor=unconfined
      # Without this the node registers in Netdata Cloud under its container
      # ID; set it per destination so nodes are distinguishable there.
      hostname: tramline-production
