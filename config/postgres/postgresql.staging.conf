# Tramline STAGING Postgres config (PG 14, containerized via Kamal).
#
# Same mechanics as postgresql.conf (see that file's header) — this REPLACES the
# image's generated config, so listen_addresses='*' must stay. Sized for the
# staging `db` accessory's 1GB / 0.5CPU cgroup limit (deploy.staging.yml), which
# is why the memory values are half of production's.

# --- connectivity (do not drop) ---
listen_addresses = '*'

# --- extensions / stats ---
# pg_stat_statements powers PgHero's query stats. Preloaded here (needs a
# restart to take effect), but ALSO requires `CREATE EXTENSION pg_stat_statements;`
# run once in the app DB after the first reboot — the preload only loads the
# module; the extension registers the queryable view.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

# --- connections ---
max_connections = 50

# --- memory (half of production, for the 1GB container) ---
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
work_mem = 5875kB
huge_pages = off

# --- checkpoints / WAL ---
checkpoint_completion_target = 0.9
wal_buffers = 16MB
wal_compression = on
min_wal_size = 1GB
max_wal_size = 4GB

# --- planner (SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- misc ---
jit = off
