# Tramline production Postgres config (PG 14, containerized via Kamal).
#
# Loaded with `postgres -c config_file=/etc/postgresql/postgresql.conf`, which
# means this file REPLACES the image's generated postgresql.conf entirely —
# anything not set here falls back to Postgres' compiled-in defaults, NOT the
# image defaults. The one image default that matters and is NOT the compiled
# default is listen_addresses (compiled default is 'localhost'); it MUST stay
# '*' below or the web/worker/netdata containers can't reach the DB.
#
# data_directory is intentionally not set: it resolves from the PGDATA env var
# the official image exports (/var/lib/postgresql/data), which is the mounted
# tramline-db-data volume.
#
# Sizing is for the `db` accessory's 3GB / 2CPU cgroup limit (see deploy.yml).
# If that limit changes, re-run PGTune (RAM = the container cap, connections =
# actual pool demand) and update these. Most values below are the PGTune OLTP
# output for 2GB RAM / 2 CPUs / 50 connections / SSD; shared_buffers is kept at
# that 2GB figure deliberately (no need to double-buffer the ~1.4GB working
# set), while effective_cache_size was raised to 2GB to reflect the 3GB cgroup.

# --- connectivity (do not drop) ---
listen_addresses = '*'

# --- extensions / stats ---
# pg_stat_statements powers PgHero's query stats. Preloaded here (needs a
# restart to take effect), but ALSO requires `CREATE EXTENSION pg_stat_statements;`
# run once in the app DB after the first reboot — the preload only loads the
# module; the extension registers the queryable view.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

# --- connections ---
# Ceiling for web(WEB_CONCURRENCY x RAILS_MAX_THREADS) + worker(pool) +
# collectors + headroom. Current baseline ~27 + netdata collector; ~47 usable
# after superuser_reserved_connections. Raise this BEFORE raising app
# concurrency, never after.
max_connections = 50

# --- memory ---
# shared_buffers stays moderate: the ~1.4GB DB fits entirely in the OS page
# cache within the 3GB cgroup, so there's no need to double-buffer it here.
# effective_cache_size reflects that ~2GB of cache is realistically available.
shared_buffers = 512MB
effective_cache_size = 2GB
maintenance_work_mem = 128MB
work_mem = 11750kB
huge_pages = off

# --- checkpoints / WAL ---
checkpoint_completion_target = 0.9
wal_buffers = 16MB
wal_compression = on
min_wal_size = 2GB
max_wal_size = 8GB

# --- planner (SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- misc ---
# OLTP workload: JIT adds latency to short queries for no benefit.
jit = off
