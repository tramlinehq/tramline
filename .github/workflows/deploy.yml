name: Deploy

on:
  # Every push to main auto-deploys Hetzner STAGING (destination resolves to
  # staging below, since inputs.destination is empty for push events).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destination:
        description: "Deploy destination"
        type: choice
        options:
          - staging            # Kamal → Hetzner staging
          - production         # Kamal → Hetzner production
          - render-production  # legacy Render deploy hooks (until cutover)
        default: staging

# One in-flight deploy per destination (push resolves to the staging group).
concurrency:
  group: deploy-${{ github.event.inputs.destination || 'staging' }}
  cancel-in-progress: false

jobs:
  # Legacy Render deploy — kept alive during the Hetzner migration so we can
  # still ship the current production (Render) until DNS cutover. Triggers
  # Render's deploy hooks; secrets are repo-level (not a GitHub Environment).
  render:
    if: github.event.inputs.destination == 'render-production'
    runs-on: ubuntu-latest
    steps:
      - name: site-jobs
        uses: wei/curl@v1
        with:
          args: -X POST https://api.render.com/deploy/${{ secrets.SITE_JOBS_PRODUCTION_SERVICE_ID }}?key=${{ secrets.SITE_JOBS_PRODUCTION_API_KEY }}
      - name: site-web
        uses: wei/curl@v1
        with:
          args: -X POST https://api.render.com/deploy/${{ secrets.SITE_WEB_PRODUCTION_SERVICE_ID }}?key=${{ secrets.SITE_WEB_PRODUCTION_API_KEY }}

  deploy:
    # Kamal path (Hetzner). Skipped when targeting legacy Render.
    if: github.event.inputs.destination != 'render-production'
    runs-on: ubuntu-latest

    # Secrets resolve from this GitHub Environment, so staging and production
    # can share env var names (DATABASE_URL, RAILS_MASTER_KEY, HETZNER_IP, …)
    # with different values. secrets-common references them by their plain
    # names; the environment scopes which value each deploy gets. Push events
    # have no input, so they resolve to the staging environment.
    environment: ${{ github.event.inputs.destination || 'staging' }}

    permissions:
      contents: read
      packages: write

    env:
      DOCKER_BUILDKIT: 1
      HETZNER_IP: ${{ secrets.HETZNER_IP }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      DEFAULT_REDIS_URL: ${{ secrets.DEFAULT_REDIS_URL }}
      SESSION_REDIS_URL: ${{ secrets.SESSION_REDIS_URL }}
      SIDEKIQ_REDIS_URL: ${{ secrets.SIDEKIQ_REDIS_URL }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
      DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
      HOST_NAME: ${{ secrets.HOST_NAME }}
      APPLELINK_URL: ${{ secrets.APPLELINK_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      FRONTEND_SENTRY_DSN: ${{ secrets.FRONTEND_SENTRY_DSN }}
      SENTRY_SECURITY_HEADER_ENDPOINT: ${{ secrets.SENTRY_SECURITY_HEADER_ENDPOINT }}
      NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
      X_MONITOR_ALLOWED: ${{ secrets.X_MONITOR_ALLOWED }}
      ARTIFACT_BUILDS_BUCKET_NAME: ${{ secrets.ARTIFACT_BUILDS_BUCKET_NAME }}
      ARTIFACT_BUILDS_BUCKET_NAME_INDIA: ${{ secrets.ARTIFACT_BUILDS_BUCKET_NAME_INDIA }}
      ASSETS_BUCKET_NAME: ${{ secrets.ASSETS_BUCKET_NAME }}
      APP_REDIRECT_MAPPING_JSON: ${{ secrets.APP_REDIRECT_MAPPING_JSON }}
      DISALLOWED_SIGN_UP_DOMAINS: ${{ secrets.DISALLOWED_SIGN_UP_DOMAINS }}
      CSP_CONNECT_SRC_URIS: ${{ secrets.CSP_CONNECT_SRC_URIS }}
      CSP_SCRIPT_SRC_URIS: ${{ secrets.CSP_SCRIPT_SRC_URIS }}
      BILLING_URL: ${{ secrets.BILLING_URL }}
      DEMO_ORG_SLUG: ${{ secrets.DEMO_ORG_SLUG }}
      DEMO_USER_SLUG: ${{ secrets.DEMO_USER_SLUG }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
      AUTH_ISSUER: ${{ secrets.AUTH_ISSUER }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_AUD: ${{ secrets.AUTH_AUD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Runtime for cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Install Kamal
        run: gem install kamal

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      # First-time provisioning (`kamal setup`) is done locally; CI ships new
      # app code to an already-bootstrapped box. Push events deploy staging.
      - name: Deploy with Kamal
        run: kamal deploy -d ${{ github.event.inputs.destination || 'staging' }}
